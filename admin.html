<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | GSSS Kullu</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7f6; padding: 40px; }
        .admin-container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #1a237e; border-bottom: 2px solid #ffd600; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #1a237e; color: white; }
        tr:hover { background: #f1f1f1; }
        .delete-btn { background: #d32f2f; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        .delete-btn:hover { background: #b71c1c; }
    </style>
</head>
<body>

    <script>
        const pass = prompt("Enter Admin Password:");
        if (pass !== "GSSSG@2026") {
            alert("Access Denied");
            window.location.href = "index.html";
        }
    </script>

    <div class="admin-container">
        <h1>Admission Submissions (2026-27)</h1>
        <button onclick="downloadExcel()" style="margin-bottom:10px; padding:10px; background:#2e7d32; color:white; border:none; border-radius:4px; cursor:pointer;">Download as Excel</button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Student Name</th>
                    <th>Aadhar</th>
                    <th>Date/Time</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
        </table>
    </div>

    <script src="admin.js"></script>
</body>
</html>
