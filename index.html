<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Printable Form</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .form-container { max-width: 500px; margin: auto; padding: 20px; border: 1px solid #ccc; }
        input, textarea { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="form-container" id="pdf-content">
        <h2>Official Submission Form</h2>
        <form id="dataForm">
            <label>Name:</label>
            <input type="text" id="name" required>
            
            <label>Email:</label>
            <input type="email" id="email" required>
            
            <label>Details:</label>
            <textarea id="details" rows="4" required></textarea>
            
            <button type="submit" id="submitBtn">Submit & Generate PDF</button>
        </form>
    </div>

    <script>
        document.getElementById('dataForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                details: document.getElementById('details').value
            };

            try {
                const response = await fetch('https://backend-gsssgkullu-in-school-website.onrender.com/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    document.getElementById('submitBtn').style.display = 'none';
                    const element = document.getElementById('pdf-content');
                    
                    if (element) {
                        html2pdf().from(element).save('submission-form.pdf').then(() => {
                            document.getElementById('submitBtn').style.display = 'block';
                            document.getElementById('dataForm').reset();
                        });
                    } else {
                        console.error("Error: Element with ID 'pdf-content' not found.");
                        alert("Form submitted, but PDF could not be generated.");
                        document.getElementById('submitBtn').style.display = 'block';
                        document.getElementById('dataForm').reset();
                    }
                } else {
                    alert("Error! Server response was not ok.");
                }
            } catch (error) {
                console.error("Fetch error:", error);
                alert("Failed to submit the form. Please make sure the backend server is running and the URL is correct.");
            }
        });
    </script>
</body>
</html>
